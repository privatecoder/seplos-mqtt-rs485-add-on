configuration:
  # RS485 Connection
  rs485_remote_ip:
    name: "Remote RS485 IP Address"
    description: "Only used once to create the initial settings; afterwards change it in the Seplos BMS app in the sidebar. IP address of the remote RS485 device (e.g., Waveshare RS485-to-ETH). Leave empty for local serial connection."
  
  rs485_remote_port:
    name: "Remote RS485 Port"
    description: "Only used once to create the initial settings; afterwards change it in the Seplos BMS app in the sidebar. TCP port of the remote RS485 device (default: 4196)"
  
  serial_interface:
    name: "Serial Interface"
    description: "Only used once to create the initial settings; afterwards change it in the Seplos BMS app in the sidebar. Serial device path (e.g., /dev/ttyUSB0 for local or /tmp/vcom0 for remote via socat)"

  serial_baudrate:
    name: "Baud Rate"
    description: "Only used once to create the initial settings; afterwards change it in the Seplos BMS app in the sidebar. auto = 19200 for a single pack (RS485-1/2), 9600 for multiple packs (CAN port). Firmware 16.04.x needs 9600 on RS485-1/2 as well."
  
  # Battery Configuration
  number_of_packs:
    name: "Number of Battery Packs"
    description: "Only used once to create the initial settings; afterwards change it in the Seplos BMS app in the sidebar. Total number of battery packs to monitor (1 = single pack, 2+ = master + slaves)"
  
  min_cell_voltage:
    name: "Minimum Cell Voltage"
    description: "Only used once to create the initial settings; afterwards change it in the Seplos BMS app in the sidebar. Lower end of the cell voltage range in volts (only used for display ranges, not read from the BMS)"
  
  max_cell_voltage:
    name: "Maximum Cell Voltage"
    description: "Only used once to create the initial settings; afterwards change it in the Seplos BMS app in the sidebar. Upper end of the cell voltage range in volts (only used for display ranges, not read from the BMS)"

  nominal_cell_voltage:
    name: "Nominal Cell Voltage"
    description: "Only used once to create the initial settings; afterwards change it in the Seplos BMS app in the sidebar. Nominal voltage of one cell in volts (LFP: 3.2). Used for the calculated full energy (kWh) of the packs and the system."
  
  # MQTT Configuration
  mqtt_topic:
    name: "MQTT Topic"
    description: "Base MQTT topic for publishing battery data"
  
  mqtt_update_interval:
    name: "MQTT Update Interval"
    description: "Only used once to create the initial settings; afterwards change it in the Seplos BMS app in the sidebar. Seconds between MQTT updates (0 = continuous updates)"
  
  # Home Assistant Integration
  enable_ha_discovery:
    name: "Enable HA Auto-Discovery"
    description: "Automatically create sensor entities in Home Assistant"
  
  ha_discovery_prefix:
    name: "HA Discovery Prefix"
    description: "MQTT discovery prefix for Home Assistant (usually 'homeassistant')"

  invert_ha_dis_charge_measurements:
    name: "Invert HA Dis-/Charge measurements"
    description: "Inverts the values of the charging and discharging sensors in Home Assistant"
  
  maint_firmware:
    name: "EMU1101-EXT Firmware"
    description: "Only used once to create the initial settings; afterwards change it in the Seplos BMS app in the sidebar. Also read the extra data of the EMU1101-EXT patched firmware (Light from 1.5.4, Full from 1.6.4) where a pack reports it (full-width energy counters, flash storage diagnostics, on the CAN port: parameters and serial numbers of every pack). Read-only. Packs with OEM firmware are not affected."

  # System Settings
  logging_level:
    name: "Logging Level"
    description: "Set the verbosity of logs (debug shows most detail)"

tabs:
  connection:
    title: "Connection Settings"
    description: "Configure how to connect to your Seplos BMS"
  
  battery:
    title: "Battery Settings"
    description: "Configure your battery pack parameters"
  
  mqtt:
    title: "MQTT Settings"
    description: "Configure MQTT communication"
  
  homeassistant:
    title: "Home Assistant"
    description: "Configure Home Assistant integration"
  
  system:
    title: "System"
    description: "System and debugging configuration"

network:
  4196/tcp: "Remote RS485 device connection"