          - type: "markdown"
            content: |-
              **Red outline: highest · Blue outline: lowest · ⚡: passive balancing**

              Outlines identify extrema, not alarms. Ties can show both outlines.

              {% set limits = state_attr('sensor.seplos_bms_pack_3_cell_type', 'limits') %}
              {% set limits = limits if limits is mapping else {} %}
              {% set lo = limits.get('cell_voltage_min_v') %}{% set hi = limits.get('cell_voltage_max_v') %}
              {% set assigned = is_number(lo) and is_number(hi) %}
              {% if not assigned %}{% set lo = states('sensor.seplos_bms_pack_3_cell_voltage_setting_min') %}{% set hi = states('sensor.seplos_bms_pack_3_cell_voltage_setting_max') %}{% endif %}
              {% if is_number(lo) and is_number(hi) %}Shading: {% if assigned %}assigned cell datasheet{% else %}configured display range (not BMS protection settings){% endif %} · {{ lo | float }}–{{ hi | float }} V. Amber within 0.20 V of the low edge / 0.05 V of the high edge; red outside.{% else %}Voltage shading unavailable; no numeric range assumed.{% endif %}

              Probe outlines use the measured temperature extrema; all ties are marked. A missing reading is never zero.
            grid_options:
              columns: "full"
