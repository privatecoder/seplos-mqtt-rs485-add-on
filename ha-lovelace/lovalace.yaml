              | Nominal cell voltage | {% set v = limits.get('cell_voltage_nominal_v') %}{% if is_number(v) %}{{ v }} V{% else %}—{% endif %} |
              | Charge temperature minimum | {% set v = limits.get('charge_temperature_min_c') %}{% if is_number(v) %}{{ v }} °C{% else %}—{% endif %} |
