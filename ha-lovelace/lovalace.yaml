              {% set active = state_attr('sensor.seplos_bms_pack_3_bms_alarm', 'active') or [] %}
              {% if severity not in ['ok', 'alarm', 'protection', 'fault'] %}BMS alarm data unavailable.{% elif severity == 'ok' %}No BMS alarms reported.{% else %}**BMS {{ severity }}**
              {% for item in active %}
              - {{ item.key | replace('_', ' ') }}: **{{ item.state }}**
              {% else %}No condition details available.{% endfor %}{% endif %}
