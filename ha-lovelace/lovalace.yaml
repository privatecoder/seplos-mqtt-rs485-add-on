              | Discharge temperature maximum | {% set v = limits.get('discharge_temperature_max_c') %}{% if is_number(v) %}{{ v }} °C{% else %}—{% endif %} |
              | Static charge current maximum | {% set v = limits.get('charge_current_max_a') %}{% if is_number(v) %}{{ v }} A{% else %}—{% endif %} |
              | Static discharge current maximum | {% set v = limits.get('discharge_current_max_a') %}{% if is_number(v) %}{{ v }} A{% else %}—{% endif %} |

              Unknown bounds stay unknown. Current budgets below are temperature/SOC dependent advisories, not system DCL/CCL.
