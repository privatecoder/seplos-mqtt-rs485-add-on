  - title: "Pack 00"
    path: "pack-0"
    type: "sections"
    subview: true
    back_path: "/seplos/overview"
    max_columns: 3
    sections:
      - type: "grid"
        column_span: 3
        cards:
          - type: "heading"
            heading: "Pack 00 · physical layout"
            badges:
              - type: "entity"
                entity: "sensor.seplos_bms_pack_0_cell_type"
                show_state: true
          - type: "picture-elements"
            image: "/local/seplos_pack_map.svg"
            elements:
              - type: "conditional"
                conditions:
                  - condition: "template"
                    value_template: |-
                      {% set limits = state_attr('sensor.seplos_bms_pack_0_cell_type', 'limits') %}
                      {% set limits = limits if limits is mapping else {} %}
                      {% set lo = limits.get('cell_voltage_min_v') %}{% set hi = limits.get('cell_voltage_max_v') %}
                      {% set assigned = is_number(lo) and is_number(hi) %}
                      {% if not assigned %}{% set lo = states('sensor.seplos_bms_pack_0_cell_voltage_setting_min') %}{% set hi = states('sensor.seplos_bms_pack_0_cell_voltage_setting_max') %}{% endif %}
                      {% set value = states('sensor.seplos_bms_pack_0_voltage_cell_1') %}
                      {% if is_number(value) and is_number(lo) and is_number(hi) and (lo | float) < (hi | float) %}{% set v = value | float %}{% set low = lo | float %}{% set high = hi | float %}{{ (v < low or v > high) }}{% else %}{{ false }}{% endif %}
                elements:
                  - type: "state-label"
                    entity: "sensor.seplos_bms_pack_0_voltage_cell_1"
                    prefix: |
                      01
                    tap_action:
                      action: "more-info"
                    style:
                      left: "6.25%"
                      top: "37%"
                      width: "10.5%"
                      height: "18%"
                      box-sizing: "border-box"
                      display: "flex"
                      align-items: "center"
                      justify-content: "center"
                      text-align: "center"
                      white-space: "pre-line"
                      padding: "0"
                      border-radius: "8px"
                      font-size: "clamp(10px, 1.1vw, 16px)"
                      color: "transparent"
                      pointer-events: "none"
                      background: "rgba(239, 68, 68, 0.18)"
              - type: "conditional"
                conditions:
                  - condition: "template"
                    value_template: |-
                      {% set limits = state_attr('sensor.seplos_bms_pack_0_cell_type', 'limits') %}
                      {% set limits = limits if limits is mapping else {} %}
