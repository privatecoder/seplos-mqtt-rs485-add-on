              {% set checks = state_attr('sensor.seplos_bms_pack_1_datasheet_check_live', 'checks') or [] %}{% set ns = namespace(shown=false) %}
              {% for item in checks %}{% if item.result != 'ok' %}{% set ns.shown = true %}
              - {{ item.key | replace('_', ' ') }}: **{{ item.result | replace('_', ' ') }}**{% if item.limit is not none %} · limit {{ item.limit }} {{ item.unit or '' }}{% endif %}{% if item.reason %} · {{ item.reason | replace('_', ' ') }}{% endif %}
              {% endif %}{% endfor %}{% if not ns.shown and checks %}All available checks are OK.{% elif not checks and not reason %}No check details available.{% endif %}

              **BMS settings vs datasheet · {{ states('sensor.seplos_bms_pack_1_datasheet_check_parameters') }}**
              {% set reason = state_attr('sensor.seplos_bms_pack_1_datasheet_check_parameters', 'reason') %}{% if reason %}{{ reason | replace('_', ' ') }}{% endif %}
              {% set checks = state_attr('sensor.seplos_bms_pack_1_datasheet_check_parameters', 'checks') or [] %}{% set ns = namespace(shown=false) %}
