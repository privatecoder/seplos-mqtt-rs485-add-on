name: "Seplos MQTT RS485 Add-on"
description: "Read Seplos BMS 2.0/10E/V16 (EMU1101) data via RS485 and publish it to HA via MQTT"
version: "2.0.0-beta14"
slug: "seplos_mqtt_rs485_add-on"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
host_network: true
watchdog: "http://[HOST]:8080/health"
uart: true
usb: true
hassio_api: true
homeassistant_api: false
services:
  - mqtt:need
ingress: true
ingress_port: 0
panel_title: "Seplos BMS"
panel_icon: "mdi:battery-high"
options:
  mqtt_topic: "seplos"
  enable_ha_discovery: true
  ha_discovery_prefix: "homeassistant"
  invert_ha_dis_charge_measurements: false
  logging_level: "info"
schema:
  # legacy connection options: migration input only (the Supervisor drops keys that are not in the
  # schema), optional and without defaults; the add-on removes them after the migration
  rs485_remote_ip: "str?"
  rs485_remote_port: "port?"
  serial_interface: "str?"
  serial_baudrate: "list(auto|9600|19200)?"
  number_of_packs: "int(1,16)?"
  min_cell_voltage: "float?"
  max_cell_voltage: "float?"
  nominal_cell_voltage: "float(0.5,5)?"
  mqtt_update_interval: "int?"
  maint_firmware: "bool?"
  mqtt_topic: "str"
  enable_ha_discovery: "bool"
  ha_discovery_prefix: "str"
  invert_ha_dis_charge_measurements: "bool"
  logging_level: "list(info|error|debug)"
